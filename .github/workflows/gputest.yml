name: GPU test binaries (local verification only)

on:
  push:
    branches: ['gputest/**']

jobs:
  windows:
    runs-on: windows-2022
    env:
      SCCACHE_GHA_ENABLED: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
      - name: Locate vcpkg
        id: vcpkg
        shell: pwsh
        run: |
          $vcpkgRoot = Split-Path (Get-Command vcpkg).Source
          "root=$vcpkgRoot" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Install glslang
        shell: pwsh
        run: |
          vcpkg install glslang[tools,opt]:x64-windows
          "${{ steps.vcpkg.outputs.root }}\installed\x64-windows\tools\glslang" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - uses: mozilla-actions/sccache-action@v0.0.11
      - name: Configure
        shell: cmd
        run: |
          cmake -S . -B _Build/windows -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF -DKYTY_BUILD_LAUNCHER=OFF -DCMAKE_C_COMPILER=clang-cl -DCMAKE_CXX_COMPILER=clang-cl -DCMAKE_C_COMPILER_LAUNCHER=sccache -DCMAKE_CXX_COMPILER_LAUNCHER=sccache
      - name: Build
        shell: cmd
        run: cmake --build _Build/windows --target shader_recompiler_compute_tests shader_cfg_tests --parallel
      - uses: actions/upload-artifact@v4
        with:
          name: gputest-${{ github.sha }}
          path: |
            _Build/windows/*.exe
            _Build/windows/*.dll
